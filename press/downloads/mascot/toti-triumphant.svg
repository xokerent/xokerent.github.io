<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="body" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F4F6FA"/>
      <stop offset="100%" stop-color="#B8C2D4"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#FFB627" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#FFB627" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tuft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFDA7E"/>
      <stop offset="100%" stop-color="#D88800"/>
    </linearGradient>
    <filter id="bodyShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="22"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- confetti -->
  <g>
    <rect x="60" y="80" width="14" height="6" rx="2" fill="#E94560" transform="rotate(20 67 83)"/>
    <rect x="510" y="70" width="14" height="6" rx="2" fill="#FFB627" transform="rotate(-25 517 73)"/>
    <rect x="120" y="160" width="12" height="5" rx="2" fill="#16C79A" transform="rotate(-15 126 162)"/>
    <rect x="460" y="170" width="12" height="5" rx="2" fill="#A45AFF" transform="rotate(35 466 172)"/>
    <rect x="40" y="240" width="10" height="5" rx="2" fill="#3D8BFD" transform="rotate(40 45 242)"/>
    <rect x="540" y="260" width="10" height="5" rx="2" fill="#E94560" transform="rotate(-30 545 262)"/>
    <circle cx="180" cy="100" r="4" fill="#FFB627"/>
    <circle cx="420" cy="120" r="4" fill="#16C79A"/>
  </g>

  <!-- jumping body - lifted, bigger ground gap shadow -->
  <ellipse cx="300" cy="560" rx="120" ry="16" fill="#000" opacity="0.18"/>

  <g filter="url(#bodyShadow)" transform="translate(0 -30)">
    <circle cx="300" cy="320" r="220" fill="url(#body)"/>
  </g>
  <g transform="translate(0 -30)">
    <circle cx="300" cy="320" r="220" fill="url(#rim)"/>
    <path d="M 110 220 Q 300 90 490 220 Q 450 290 300 290 Q 150 290 110 220 Z" fill="#FFFFFF" opacity="0.40"/>

    <!-- closed happy-crescent eyes -->
    <path d="M 200 290 Q 240 250 280 290" stroke="#1A1A1A" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 320 290 Q 360 250 400 290" stroke="#1A1A1A" stroke-width="10" fill="none" stroke-linecap="round"/>

    <!-- cheek blush -->
    <ellipse cx="180" cy="380" rx="28" ry="16" fill="#FF6B85" opacity="0.7"/>
    <ellipse cx="420" cy="380" rx="28" ry="16" fill="#FF6B85" opacity="0.7"/>
  </g>

  <!-- tuft -->
  <g transform="translate(300 80) rotate(8)">
    <path d="M 0 0 Q -32 -55 -8 -110 Q 6 -75 30 -55 Q 18 -25 0 0 Z" fill="url(#tuft)" stroke="#7A4900" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M 0 0 Q -32 -55 -8 -110 Q -18 -65 -10 -30 Q -5 -10 0 0 Z" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- victory motion lines -->
  <g stroke="#FFB627" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="80" y1="380" x2="40" y2="400"/>
    <line x1="520" y1="380" x2="560" y2="400"/>
    <line x1="100" y1="450" x2="70" y2="480"/>
    <line x1="500" y1="450" x2="530" y2="480"/>
  </g>
</svg>
