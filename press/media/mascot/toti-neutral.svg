<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="body" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F4F6FA"/>
      <stop offset="100%" stop-color="#B8C2D4"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#FFB627" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#FFB627" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tuft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFDA7E"/>
      <stop offset="100%" stop-color="#D88800"/>
    </linearGradient>
    <radialGradient id="eye" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2B3650"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="bodyShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="300" cy="540" rx="170" ry="22" fill="#000" opacity="0.25"/>

  <!-- body -->
  <g filter="url(#bodyShadow)">
    <circle cx="300" cy="320" r="220" fill="url(#body)"/>
  </g>
  <circle cx="300" cy="320" r="220" fill="url(#rim)"/>
  <path d="M 110 220 Q 300 90 490 220 Q 450 290 300 290 Q 150 290 110 220 Z" fill="#FFFFFF" opacity="0.40"/>

  <!-- eyes neutral -->
  <ellipse cx="240" cy="295" rx="40" ry="56" fill="url(#eye)"/>
  <ellipse cx="225" cy="275" rx="14" ry="18" fill="#FFFFFF" opacity="0.95"/>
  <ellipse cx="252" cy="318" rx="6" ry="9" fill="#FFFFFF" opacity="0.55"/>
  <ellipse cx="360" cy="295" rx="40" ry="56" fill="url(#eye)"/>
  <ellipse cx="345" cy="275" rx="14" ry="18" fill="#FFFFFF" opacity="0.95"/>
  <ellipse cx="372" cy="318" rx="6" ry="9" fill="#FFFFFF" opacity="0.55"/>

  <!-- cheek blush -->
  <ellipse cx="180" cy="380" rx="24" ry="14" fill="#FF8FA3" opacity="0.55"/>
  <ellipse cx="420" cy="380" rx="24" ry="14" fill="#FF8FA3" opacity="0.55"/>

  <!-- tuft -->
  <g transform="translate(300 110)">
    <path d="M 0 0 Q -32 -55 -8 -110 Q 6 -75 30 -55 Q 18 -25 0 0 Z" fill="url(#tuft)" stroke="#7A4900" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M 0 0 Q -32 -55 -8 -110 Q -18 -65 -10 -30 Q -5 -10 0 0 Z" fill="#FFFFFF" opacity="0.35"/>
  </g>
</svg>
