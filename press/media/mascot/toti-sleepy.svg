<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="body" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F4F6FA"/>
      <stop offset="100%" stop-color="#B8C2D4"/>
    </radialGradient>
    <linearGradient id="tuft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFDA7E"/>
      <stop offset="100%" stop-color="#D88800"/>
    </linearGradient>
    <filter id="bodyShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="300" cy="555" rx="170" ry="20" fill="#000" opacity="0.22"/>

  <g filter="url(#bodyShadow)">
    <circle cx="300" cy="320" r="220" fill="url(#body)"/>
  </g>
  <path d="M 110 220 Q 300 90 490 220 Q 450 290 300 290 Q 150 290 110 220 Z" fill="#FFFFFF" opacity="0.35"/>

  <!-- half-lidded sleepy eyes (arcs over closed ellipses) -->
  <path d="M 200 310 Q 240 295 280 310" stroke="#1A1A1A" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M 320 310 Q 360 295 400 310" stroke="#1A1A1A" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- lashes -->
  <line x1="208" y1="305" x2="200" y2="318" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>
  <line x1="272" y1="305" x2="280" y2="318" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round"/>

  <!-- subtle cheek -->
  <ellipse cx="180" cy="380" rx="22" ry="12" fill="#FF8FA3" opacity="0.4"/>
  <ellipse cx="420" cy="380" rx="22" ry="12" fill="#FF8FA3" opacity="0.4"/>

  <!-- tuft -->
  <g transform="translate(300 110)">
    <path d="M 0 0 Q -32 -55 -8 -110 Q 6 -75 30 -55 Q 18 -25 0 0 Z" fill="url(#tuft)" stroke="#7A4900" stroke-width="2" stroke-opacity="0.4"/>
  </g>

  <!-- floating Z's -->
  <g fill="#3D8BFD" opacity="0.9" font-family="'Fredoka', system-ui, sans-serif" font-weight="800">
    <text x="430" y="160" font-size="42">z</text>
    <text x="465" y="115" font-size="58">Z</text>
    <text x="510" y="70" font-size="76">Z</text>
  </g>
</svg>
